name: Enable-GitHub-Pages
on:
  push:
    paths:
      - ".github/workflows/pages-bootstrap.yml"

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Create Pages site via REST
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "target=$OWNER/$REPO"
          CODE=$(curl -s -o /tmp/pages_resp.json -w "%{http_code}" \
            -X POST "https://api.github.com/repos/$OWNER/$REPO/pages" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json, application/vnd.github.pages-preview+json")
          echo "::notice::PAGES_CREATE_HTTP=$CODE BODY=$(head -c 600 /tmp/pages_resp.json | tr '\n' ' ')"
          if [ "$CODE" = "409" ]; then
            CODE2=$(curl -s -o /tmp/pages_upd.json -w "%{http_code}" \
              -X PUT "https://api.github.com/repos/$OWNER/$REPO/pages" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json, application/vnd.github.pages-preview+json" \
              -d '{"source":{"branch":"main","path":"/"}}')
            echo "::notice::PAGES_UPDATE_HTTP=$CODE2 BODY=$(head -c 600 /tmp/pages_upd.json | tr '\n' ' ')"
          fi
