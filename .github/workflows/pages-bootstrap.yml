name: Enable-GitHub-Pages
on:
  push:
    paths:
      - ".github/workflows/pages-bootstrap.yml"

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.pages.create({
                owner, repo,
                source: { branch: 'main', path: '/' },
              });
              console.log('Pages enabled (source: main /)');
            } catch (e) {
              if (e.status === 409 || e.message.includes('already exists')) {
                console.log('Pages already configured - updating source to main /');
                await github.rest.pages.update({ owner, repo, source: { branch: 'main', path: '/' } });
              } else {
                throw e;
              }
            }
