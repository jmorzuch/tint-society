name: Enable-GitHub-Pages
on:
  push:
    paths:
      - ".github/workflows/pages-bootstrap.yml"

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let log = 'repo=' + owner + '/' + repo + '\n';
            try {
              await github.rest.pages.create({
                owner, repo,
                source: { branch: 'main', path: '/' },
              });
              log += 'RESULT: created\n';
            } catch (e) {
              log += 'RESULT: caught status=' + e.status + '\nmessage=' + e.message + '\n';
              if (e.response && e.response.data) log += 'data=' + JSON.stringify(e.response.data).slice(0, 2000) + '\n';
              if (e.status === 409 || /already exists/i.test(e.message)) {
                try {
                  await github.rest.pages.update({ owner, repo, source: { branch: 'main', path: '/' } });
                  log += 'RESULT: updated existing\n';
                } catch (e2) {
                  log += 'UPDATE FAILED status=' + e2.status + '\nmessage=' + e2.message + '\n';
                  if (e2.response && e2.response.data) log += 'data=' + JSON.stringify(e2.response.data).slice(0, 2000) + '\n';
                }
              } else {
                throw new Error('pages.create failed: status=' + e.status + ' message=' + e.message);
              }
            }
            fs.writeFileSync('/tmp/pages-bootstrap.log', log);
            console.log(log);
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-bootstrap-log
          path: /tmp/pages-bootstrap.log
